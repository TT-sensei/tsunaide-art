<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#f7f3ea">
  <title>つないでアート</title>
  <link rel="stylesheet" href="style.css?v=20261012i">
</head>
<body>
<header class="app-header">
  <div class="header-copy"><h1>つないでアート</h1><p>点と点をつないで、作品をつくろう</p></div>
  <img
    class="navi-group-decoration"
    src="https://tt-sensei.github.io/navi-character-/assets/web/groups/group-huddle.webp"
    alt=""
    aria-hidden="true"
    decoding="async">
  <div class="header-actions"><button id="teacherBtn" class="button secondary">先生用</button><button id="galleryBtn" class="button secondary">作品を見る</button></div>
</header>
<nav class="mode-tabs" aria-label="制作モード">
  <button data-mode="trace" class="tab active">お手本を再現する</button>
  <button data-mode="free" class="tab">線をつないで自由につくる</button>
</nav>
<main>
  <section id="message" class="message">お手本を見ながら、点と点を線でつないで再現しよう。自由にアレンジしてもOK。</section>
  <div id="workspace" class="workspace">
    <section id="samplePanel" class="panel sample-panel">
      <div class="panel-title"><h2>お手本</h2><button id="chooseSampleBtn" class="button small">お手本をえらぶ</button></div>
      <div id="sampleName" class="work-name"></div>
      <div id="sampleBoard" class="board-wrap"></div>
      <div id="matchInfo" class="match-info" aria-live="polite"></div>
    </section>
    <section class="panel creation-panel">
      <div class="panel-title"><h2>作品をつくる</h2><button id="previewBtn" class="button small secondary">点をかくす</button></div>
      <div id="artBoard" class="board-wrap"></div>
    </section>
  </div>
</main>
<footer class="toolbar" aria-label="制作ツール">
  <div class="tool-group">
    <button id="drawBtn" class="tool active">✏️<span>かく</span></button>
    <button id="eraseBtn" class="tool">消<span>けす</span></button>
    <button id="undoBtn" class="tool">↶<span>もどす</span></button>
    <button id="redoBtn" class="tool">↷<span>やりなおす</span></button>
  </div>
  <div class="tool-group colors" id="colors" aria-label="線の色"></div>
  <div class="tool-group widths" aria-label="線の太さ">
    <button data-width="3" class="width-btn"><i style="height:3px"></i><span>ほそい</span></button>
    <button data-width="6" class="width-btn active"><i style="height:6px"></i><span>ふつう</span></button>
    <button data-width="10" class="width-btn"><i style="height:10px"></i><span>ふとい</span></button>
  </div>
  <div class="tool-group">
    <label class="bg-label">背景 <input id="bgColor" type="color" value="#ffffff"></label>
    <button id="clearBtn" class="tool danger">×<span>ぜんぶけす</span></button>
    <button id="saveBtn" class="tool primary">💾<span>ほぞん</span></button>
    <button id="pngBtn" class="tool primary">⇩<span>PNG</span></button>
  </div>
</footer>

<dialog id="teacherDialog">
  <div class="dialog-head"><h2>先生用｜お手本をつくる</h2><button class="close" data-close="teacher" aria-label="閉じる">×</button></div>
  <p class="teacher-help">右の制作画面で点をつないで作品を作り、名前をつけてお手本として登録できます。登録したお手本は、この端末のブラウザに保存されます。</p>
  <label class="teacher-label" for="teacherName">お手本の名前</label>
  <input id="teacherName" class="teacher-input" maxlength="40" placeholder="例：くるま、春の花">
  <label class="teacher-label" for="teacherLevel">むずかしさ</label>
  <select id="teacherLevel" class="teacher-input"><option>かんたん</option><option selected>ふつう</option><option>ちょっとむずかしい</option></select>
  <div class="teacher-actions"><button id="registerSampleBtn" class="button">今の作品をお手本に登録</button><button id="copySampleCodeBtn" class="button secondary">今の作品のコードをコピー</button></div><div class="teacher-actions"><button id="exportSamplesBtn" class="button secondary">お手本を書き出す</button></div>
  <div class="teacher-actions"><label class="button secondary file-button" for="importSamplesFile">お手本データを読み込む</label><input id="importSamplesFile" type="file" accept=".json,application/json" hidden></div>
  <p class="teacher-help">別の端末へ移すときは「書き出す」で保存し、移動先で「読み込む」を使います。読み込んだデータは、登録済みのお手本に追加されます。</p>
  <h3 class="teacher-subhead">登録したお手本</h3><div id="teacherSamplesList" class="teacher-samples-list"></div>
</dialog>
<dialog id="sampleDialog"><form method="dialog"><div class="dialog-head"><h2>お手本をえらぶ</h2><button class="close" aria-label="閉じる">×</button></div><div id="sampleList" class="card-grid"></div></form></dialog>
<dialog id="galleryDialog"><div class="dialog-head"><h2>保存した作品</h2><button class="close" data-close="gallery" aria-label="閉じる">×</button></div><div id="galleryList" class="card-grid"></div><p id="emptyGallery" class="empty">まだ作品はありません。</p></dialog>
<dialog id="previewDialog"><div class="dialog-head"><h2 id="previewTitle">作品</h2><button class="close" data-close="preview" aria-label="閉じる">×</button></div><div id="previewBoard" class="preview-board"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js?v=20261012n"></script>
</body></html>
